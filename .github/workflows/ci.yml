name: Azure SQL MCP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MCP checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          cache-suffix: ${{ runner.os }}-${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --dev --locked

      - name: Ruff
        run: uv run ruff check src tests scripts

      - name: Pyright
        run: uv run pyright

      - name: Compile
        run: uv run python -m compileall -q src tests scripts

      - name: Scan secrets and external knowledge references
        run: uv run python scripts/verify_repository_content.py

      - name: Check local Markdown links
        run: uv run python scripts/check_markdown_links.py

      - name: Run tests
        run: uv run pytest -q

      - name: Build
        run: uv build
