[project]
name = "azure-sql-mcp"
version = "2.3.0"
description = "Typed Azure SQL performance tuning, triage, and reviewed plan enforcement over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Balwinder Singh", email = "Balwinder@khojfrontiers.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "azure-identity>=1.23.0",
    "mcp[cli]>=1.25.0",
    "mssql-python>=1.10.0",
    "sqlglot>=27.17.0",
]

[project.urls]
Changelog = "https://github.com/akaalholdings/azure-sql-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/akaalholdings/azure-sql-mcp/issues"
Source = "https://github.com/akaalholdings/azure-sql-mcp"

[project.scripts]
azure-sql-mcp = "azure_sql_mcp:main"
azure-sql-mcp-learning = "azure_sql_mcp.learning_cli:main"
azure-sql-mcp-index-history = "azure_sql_mcp.index_history_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.407",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
